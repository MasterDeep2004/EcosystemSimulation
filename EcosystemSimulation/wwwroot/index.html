<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ecosystem Simulation Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>
            🌍 Ecosystem Simulation Dashboard
        </h1>

        <p class="subtitle">
            Real-time predator-prey ecosystem using
            genetic algorithms and population dynamics.
        </p>

        <div class="info">
            <span id="generation">
                Generation: 0
            </span>

            <span id="event">
                Event: None
            </span>
        </div>

        <canvas
            id="ecosystemCanvas"
            width="900"
            height="450">
        </canvas>

        <div id="status">
            Connecting...
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
